<style>
:root {
  --paper:#e8e5e0;
  --ink:#171717;
  --line:rgba(23,23,23,.22);
}
* { box-sizing:border-box; }
html,body {
  min-height:100%;
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Helvetica,Arial,sans-serif;
}
body { padding:32px; }
.page { max-width:1200px; margin:0 auto; }
header {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:24px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
h1 {
  margin:0;
  font-size:clamp(30px,6vw,76px);
  font-weight:400;
  letter-spacing:1px;
  line-height:1;
}
a { color:inherit; text-decoration:none; }
a:hover { text-decoration:underline; text-underline-offset:4px; }
nav {
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.intro {
  margin:50px 0;
  font-size:clamp(20px,3vw,34px);
  line-height:1.3;
}
.gallery {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
  margin-bottom:80px;
}
.gallery-item { display:block; width:100%; }
.gallery-item img {
  display:block;
  width:100%;
  height:auto;
  background:#d5d1ca;
  transition:opacity .25s ease;
}
.gallery-item:hover img { opacity:.65; }
.gallery-item:hover { text-decoration:none; }
.caption {
  margin-top:9px;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.empty-message {
  grid-column:1 / -1;
  padding:80px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}
footer {
  padding:20px 0;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}
@media (max-width:760px) {
  body { padding:20px; }
  header { align-items:flex-start; flex-direction:column; gap:18px; }
  .gallery { grid-template-columns:repeat(5,1fr); gap:3px; }
}
@media (max-width:480px) {
  .gallery { grid-template-columns:repeat(5,1fr); gap:2px; }
}

/* =========================
   IMAGE LIGHTBOX
========================= */
.lightbox {
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.88);
  padding:40px 80px;
}

.lightbox.is-open {
  display:flex;
}

.lightbox-image {
  max-width:calc(100vw - 180px);
  max-height:calc(100vh - 80px);
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
  position:absolute;
  border:0;
  background:transparent;
  color:#fff;
  cursor:pointer;
  font-family:Helvetica,Arial,sans-serif;
  z-index:2;
}

.lightbox-close {
  top:18px;
  right:28px;
  font-size:34px;
  line-height:1;
}

.lightbox-prev,
.lightbox-next {
  top:50%;
  transform:translateY(-50%);
  font-size:46px;
  line-height:1;
  padding:20px;
}

.lightbox-prev { left:15px; }
.lightbox-next { right:15px; }

.lightbox-prev:hover,
.lightbox-next:hover,
.lightbox-close:hover {
  opacity:.6;
}

.lightbox-counter {
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  color:#fff;
  font-size:12px;
  letter-spacing:1px;
}

@media (max-width:680px) {
  .lightbox {
    padding:50px 45px;
  }

  .lightbox-image {
    max-width:calc(100vw - 90px);
    max-height:calc(100vh - 110px);
  }

  .lightbox-prev,
  .lightbox-next {
    font-size:34px;
    padding:12px;
  }

  .lightbox-prev { left:2px; }
  .lightbox-next { right:2px; }

  .lightbox-close {
    top:12px;
    right:16px;
    font-size:30px;
  }
}

</style>

<!-- IMAGE LIGHTBOX -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">×</button>
  <button class="lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous image">‹</button>
  <img class="lightbox-image" id="lightboxImage" src="" alt="">
  <button class="lightbox-next" id="lightboxNext" type="button" aria-label="Next image">›</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

</main>

<script>
(() => {
  const items = Array.from(document.querySelectorAll(".gallery-item"));
  const lightbox = document.getElementById("lightbox");
  const image = document.getElementById("lightboxImage");
  const close = document.getElementById("lightboxClose");
  const prev = document.getElementById("lightboxPrev");
  const next = document.getElementById("lightboxNext");
  const counter = document.getElementById("lightboxCounter");

  let current = 0;

  function show(index) {
    current = (index + items.length) % items.length;

    const img = items[current].querySelector("img");
    image.src = img.src;
    image.alt = img.alt;

    counter.textContent = `${current + 1} / ${items.length}`;
    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function hide() {
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");
    image.src = "";
    document.body.style.overflow = "";
  }

  items.forEach((item, index) => {
    item.addEventListener("click", (event) => {
      event.preventDefault();
      show(index);
    });
  });

  prev.addEventListener("click", (event) => {
    event.stopPropagation();
    show(current - 1);
  });

  next.addEventListener("click", (event) => {
    event.stopPropagation();
    show(current + 1);
  });

  close.addEventListener("click", (event) => {
    event.stopPropagation();
    hide();
  });

  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) hide();
  });

  document.addEventListener("keydown", (event) => {
    if (!lightbox.classList.contains("is-open")) return;

    if (event.key === "Escape") hide();
    if (event.key === "ArrowLeft") show(current - 1);
    if (event.key === "ArrowRight") show(current + 1);
  });
})();
</script>
