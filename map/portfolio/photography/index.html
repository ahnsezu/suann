<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>SUANN・遂安</title>

	<style>
		:root {
			--paper: #e8e5e0;
			--ink: #171717;
			--line: rgba(23, 23, 23, 0.22);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: Helvetica, Arial, sans-serif;
		}

		body {
			padding: 32px;
		}

		.page {
			max-width: 1200px;
			margin: 0 auto;
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: 24px;
			padding-bottom: 18px;
			border-bottom: 1px solid var(--line);
		}

		h1 {
			margin: 0;
			font-size: clamp(30px, 6vw, 76px);
			font-weight: 400;
			letter-spacing: 1px;
			line-height: 1;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
			text-underline-offset: 4px;
		}

		nav {
			font-size: 13px;
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		.intro {
			max-width: 650px;
			margin: 50px 0 70px;
			font-size: clamp(20px, 3vw, 34px);
			line-height: 1.3;
		}

		.categories {
			display: flex;
			min-height: 48vh;
			flex-direction: row;
			justify-content: center;
			align-items: center;
			gap: 12px;
			margin: 0 auto 70px;
		}

		.category-link {
			width: 291px;
			font-size: 14px;
			letter-spacing: 1px;
			text-align: center;
			text-transform: uppercase;
		}

		.category-link img {
			display: block;
			width: 291px;
			height: 393px;
			margin-bottom: 12px;
			object-fit: contain;
			background: #d5d1ca;
			transition: opacity 0.25s ease;
		}

		.category-link:hover img {
			opacity: 0.65;
		}

		.category-link:hover {
			background: rgba(255, 255, 255, 0.3);
			text-decoration: none;
		}

		footer {
			padding: 70px 0 20px;
			font-size: 12px;
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		@media (max-width: 680px) {
			body {
				padding: 20px;
			}

			header {
				align-items: flex-start;
				flex-direction: column;
				gap: 18px;
			}

			.categories {
				min-height: 42vh;
				flex-direction: column;
				margin-bottom: 48px;
			}

			.category-link,
			.category-link img {
				width: min(291px, 80vw);
			}

			.category-link img {
				height: auto;
				aspect-ratio: 291 / 393;
			}
		}
	</style>
</head>

<body>
	<main class="page">

		<header>
			<h1>PHOTOGRAPHY</h1>

			<nav>
				<a href="../">Back to portfolio</a>
			</nav>
		</header>

		<p class="intro">CATEGORIES</p>

		<nav
			class="categories"
			aria-label="Photography categories"
		>

			<!-- PORTRAITS -->
			<a
				class="category-link"
				href="./portraits/"
			>
				<img
					src="./portraits.png"
					alt="Portraits"
				>
				Portraits
			</a>

			<!-- PRODUCT PHOTOGRAPHY -->
			<a
				class="category-link"
				href="./productphotography/"
			>
				<img
					src="./productphotography.png"
					alt="Product Photography"
				>
				Product Photography
			</a>

			<!-- LANDSCAPES -->
			<a
				class="category-link"
				href="./landscapes/"
			>
				<img
					src="./landsacpes.png"
					alt="Landscapes"
				>
				Landscapes
			</a>

		</nav>

		<footer></footer>

	</main>
</body>
</html>
