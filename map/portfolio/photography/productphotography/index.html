<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUANN・遂安 — PRODUCT PHOTOGRAPHY</title>
<style>
:root {
  --paper:#e8e5e0;
  --ink:#171717;
  --line:rgba(23,23,23,.22);
}
* { box-sizing:border-box; }
html,body {
  min-height:100%;
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Helvetica,Arial,sans-serif;
}
body { padding:32px; }
.page { max-width:1200px; margin:0 auto; }
header {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:24px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
h1 {
  margin:0;
  font-size:clamp(30px,6vw,76px);
  font-weight:400;
  letter-spacing:1px;
  line-height:1;
}
a { color:inherit; text-decoration:none; }
a:hover { text-decoration:underline; text-underline-offset:4px; }
nav {
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.intro {
  margin:50px 0;
  font-size:clamp(20px,3vw,34px);
  line-height:1.3;
}
.gallery {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:80px;
}
.gallery-item { display:block; width:100%; }
.gallery-item img {
  display:block;
  width:100%;
  height:auto;
  background:#d5d1ca;
  transition:opacity .25s ease;
}
.gallery-item:hover img { opacity:.65; }
.gallery-item:hover { text-decoration:none; }
.caption {
  margin-top:9px;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.empty-message {
  grid-column:1 / -1;
  padding:80px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}
footer {
  padding:20px 0;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}
@media (max-width:760px) {
  body { padding:20px; }
  header { align-items:flex-start; flex-direction:column; gap:18px; }
  .gallery { grid-template-columns:repeat(2,1fr); gap:12px; }
}
@media (max-width:480px) {
  .gallery { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<main class="page">
<header>
<h1>PRODUCT PHOTOGRAPHY</h1>
<nav><a href="../">Back to Photography</a></nav>
</header>

<p class="intro">SELECTED WORKS</p>

<section class="gallery" aria-label="PRODUCT PHOTOGRAPHY gallery">

<!--
사진을 추가하려면 아래 형식을 복사하세요.

<a class="gallery-item" href="./01.jpg" target="_blank">
  <img src="./01.jpg" alt="PRODUCT PHOTOGRAPHY 01">
  <div class="caption">01</div>
</a>
-->

<div class="empty-message">Selected works — coming soon.</div>

</section>

<footer>
<a href="../">← Back to Photography</a>
</footer>
</main>
</body>
</html>
