<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #f5f3ef;
  color: #1d1d1d;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-width: 0;
}

.page {
  width: min(100% - 40px, 1800px);
  margin: 0 auto;
  padding: 42px 0 80px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 24px;
  margin-bottom: 36px;
}

h1 {
  margin: 0;
  font-size: clamp(22px, 2.2vw, 34px);
  font-weight: 500;
  letter-spacing: .04em;
}

header a {
  color: inherit;
  text-decoration: none;
  font-size: clamp(12px, 1vw, 15px);
}

.intro {
  margin: 0 0 18px;
  font-size: clamp(10px, .8vw, 12px);
  letter-spacing: .16em;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: clamp(8px, 1.1vw, 18px);
  width: 100%;
}

.gallery-item {
  display: block;
  min-width: 0;
  color: inherit;
  text-decoration: none;
  cursor: zoom-in;
}

.gallery-item img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #d5d1ca;
  transition: opacity .2s ease, transform .2s ease;
}

.gallery-item:hover img {
  opacity: .82;
}

.caption {
  padding-top: 7px;
  font-size: 10px;
  letter-spacing: .08em;
}

/* Large tablet / small laptop */
@media (max-width: 1200px) {
  .page { width: min(100% - 32px, 1100px); }
  .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* Tablet */
@media (max-width: 820px) {
  .page {
    width: calc(100% - 24px);
    padding-top: 28px;
  }

  header {
    margin-bottom: 26px;
  }

  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
}

/* Phone */
@media (max-width: 560px) {
  .page {
    width: calc(100% - 16px);
    padding-top: 22px;
    padding-bottom: 50px;
  }

  header {
    align-items: flex-start;
    margin-bottom: 22px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .caption {
    font-size: 9px;
    padding-top: 5px;
  }
}

/* Very small phone */
@media (max-width: 360px) {
  .gallery {
    grid-template-columns: 1fr;
    gap: 14px;
  }
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: clamp(12px, 4vw, 50px);
  background: rgba(0, 0, 0, .9);
}

.lightbox.is-open {
  display: flex;
}

.lightbox-image {
  display: block;
  width: auto;
  height: auto;
  max-width: min(92vw, 1800px);
  max-height: 88vh;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
  position: fixed;
  z-index: 10001;
  border: 0;
  background: rgba(255,255,255,.12);
  color: #fff;
  cursor: pointer;
  width: clamp(38px, 4vw, 54px);
  height: clamp(38px, 4vw, 54px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(22px, 2.5vw, 34px);
  line-height: 1;
  border-radius: 50%;
  transition: background .2s ease;
}

.lightbox-close:hover,
.lightbox-prev:hover,
.lightbox-next:hover {
  background: rgba(255,255,255,.25);
}

.lightbox-close {
  top: clamp(12px, 2vw, 28px);
  right: clamp(12px, 2vw, 28px);
}

.lightbox-prev {
  left: clamp(10px, 2vw, 30px);
  top: 50%;
  transform: translateY(-50%);
}

.lightbox-next {
  right: clamp(10px, 2vw, 30px);
  top: 50%;
  transform: translateY(-50%);
}

.lightbox-counter {
  position: fixed;
  z-index: 10001;
  left: 50%;
  bottom: clamp(12px, 2vw, 24px);
  transform: translateX(-50%);
  color: #fff;
  font-size: clamp(10px, 1vw, 13px);
  letter-spacing: .12em;
  white-space: nowrap;
  background: rgba(0,0,0,.3);
  padding: 6px 10px;
  border-radius: 20px;
}

@media (max-width: 560px) {
  .lightbox {
    padding: 50px 8px 45px;
  }

  .lightbox-image {
    max-width: 96vw;
    max-height: 82vh;
  }

  .lightbox-prev {
    left: 7px;
  }

  .lightbox-next {
    right: 7px;
  }

  .lightbox-close {
    top: 10px;
    right: 10px;
  }
}
</style>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">‹</button>
  <img class="lightbox-image" id="lightboxImage" src="" alt="">
  <button class="lightbox-next" id="lightboxNext" aria-label="Next image">›</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script>
const items = [...document.querySelectorAll('.gallery-item')];
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
const counter = document.getElementById('lightboxCounter');
const closeButton = document.getElementById('lightboxClose');
const prevButton = document.getElementById('lightboxPrev');
const nextButton = document.getElementById('lightboxNext');

let currentIndex = 0;

function showImage(index) {
  currentIndex = (index + items.length) % items.length;
  const img = items[currentIndex].querySelector('img');

  lightboxImage.src = img.src;
  lightboxImage.alt = img.alt;
  counter.textContent = `${currentIndex + 1} / ${items.length}`;
}

function openLightbox(index) {
  showImage(index);
  lightbox.classList.add('is-open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('is-open');
  lightbox.setAttribute('aria-hidden', 'true');
  lightboxImage.src = '';
  document.body.style.overflow = '';
}

items.forEach((item, index) => {
  item.addEventListener('click', event => {
    event.preventDefault();
    openLightbox(index);
  });
});

prevButton.addEventListener('click', event => {
  event.stopPropagation();
  showImage(currentIndex - 1);
});

nextButton.addEventListener('click', event => {
  event.stopPropagation();
  showImage(currentIndex + 1);
});

closeButton.addEventListener('click', event => {
  event.stopPropagation();
  closeLightbox();
});

lightbox.addEventListener('click', event => {
  if (event.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', event => {
  if (!lightbox.classList.contains('is-open')) return;

  if (event.key === 'Escape') closeLightbox();
  if (event.key === 'ArrowLeft') showImage(currentIndex - 1);
  if (event.key === 'ArrowRight') showImage(currentIndex + 1);
});
</script>
